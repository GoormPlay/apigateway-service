
# ✅ Actuator 설정 자동 삽입
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true
    mongo:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
