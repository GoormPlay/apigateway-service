nameOverride: apigateway
fullnameOverride: apigateway-service
image:
  repository: roin09/apigateway-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  useConfigMap: true
  useSecret: true

replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  host: "api.aws-test-site.shop"

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  dataFromKey: apigateway-service-secret

affinity: {}

resources:
  requests:
    cpu: 200m     # 기존값보다 낮춤
    memory: 256Mi # 기존값보다 낮춤
  limits:
    cpu: 400m
    memory: 512Mi

rollouts:
  enabled: false
  strategy: blueGreen
  autoPromotionEnabled: false
  blueGreen:
    scaleDownDelaySeconds: 300